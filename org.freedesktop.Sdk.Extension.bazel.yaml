id: org.freedesktop.Sdk.Extension.bazel
branch: '23.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '23.08'
separate-locales: false
modules:
  - name: bazel
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
      no-debuginfo-compression: true
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/bazelbuild/bazel/releases/download/7.4.0/bazel-7.4.0-linux-x86_64
        sha256: 48ea0ff9d397a48add6369c261c5a4431fe6d5d5348cfb81411782fb80c388d3
        dest-filename: bazel
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/bazelbuild/bazel/releases/download/7.4.0/bazel-7.4.0-linux-arm64
        sha256: fac4b954e0501c2be8b9653a550b443eb85284e568d08b102977e2bf587b09d7
        dest-filename: bazel
    build-commands:
      - chmod +x bazel
      - install -d /usr/lib/sdk/bazel/bin
      - cp -rp bazel /usr/lib/sdk/bazel/bin/bazel

  - name: scripts
    sources:
      - type: script
        commands:
          - export PATH=$PATH:/usr/lib/sdk/bazel/bin
        dest-filename: enable.sh
    buildsystem: simple
    build-commands:
      - cp enable.sh /usr/lib/sdk/bazel/

  - name: metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.bazel.metainfo.xml
    buildsystem: simple
    build-commands:
      - install -Dm0644 org.freedesktop.Sdk.Extension.bazel.metainfo.xml ${FLATPAK_DEST}/share/metainfo/org.freedesktop.Sdk.Extension.bazel.metainfo.xml
