id: org.freedesktop.Sdk.Extension.bazel
branch: '25.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '25.08'
separate-locales: false
modules:
  - name: bazel
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
      no-debuginfo-compression: true
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/bazelbuild/bazel/releases/download/9.2.0/bazel-9.2.0-linux-x86_64
        sha256: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
        dest-filename: bazel
        x-checker-data:
          type: anitya
          project-id: 15227
          url-template: https://github.com/bazelbuild/bazel/releases/download/$version/bazel-$version-linux-x86_64
          stable-only: true
          is-important: true
          appstream-changes: true
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/bazelbuild/bazel/releases/download/9.2.0/bazel-9.2.0-linux-arm64
        sha256: 049dd21f40ad979db11c3ee68c96a42ce75f1185e69ac61ab20de1501427a410
        dest-filename: bazel
        x-checker-data:
          type: anitya
          project-id: 15227
          url-template: https://github.com/bazelbuild/bazel/releases/download/$version/bazel-$version-linux-arm64
          stable-only: true
          is-important: true
          appstream-changes: true

    build-commands:
      - chmod +x bazel
      - install -d /usr/lib/sdk/bazel/bin
      - cp -rp bazel /usr/lib/sdk/bazel/bin/bazel

  - name: scripts
    sources:
      - type: script
        commands:
          - export PATH=$PATH:/usr/lib/sdk/bazel/bin
        dest-filename: enable.sh
    buildsystem: simple
    build-commands:
      - cp enable.sh /usr/lib/sdk/bazel/

  - name: metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.bazel.metainfo.xml
    buildsystem: simple
    build-commands:
      - install -Dm0644 org.freedesktop.Sdk.Extension.bazel.metainfo.xml ${FLATPAK_DEST}/share/metainfo/org.freedesktop.Sdk.Extension.bazel.metainfo.xml
