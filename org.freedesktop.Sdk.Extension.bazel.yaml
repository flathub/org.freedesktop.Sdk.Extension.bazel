id: org.freedesktop.Sdk.Extension.bazel
branch: '23.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '23.08'
separate-locales: false
modules:
  - name: bazel
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
      no-debuginfo-compression: true
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/bazelbuild/bazel/releases/download/9.0.2/bazel-9.0.2-linux-x86_64
        sha256: 422e7a1690b76d7e615c29091d3aca28d0bd3a93fe3c93cbefb8f72d774926d5
        dest-filename: bazel
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/bazelbuild/bazel/releases/download/9.0.2/bazel-9.0.2-linux-arm64
        sha256: e9fc2c7b0027619058acae81c063e5ced683cb0f1598e9373b4f752820c03adb
        dest-filename: bazel
    build-commands:
      - chmod +x bazel
      - install -d /usr/lib/sdk/bazel/bin
      - cp -rp bazel /usr/lib/sdk/bazel/bin/bazel

  - name: scripts
    sources:
      - type: script
        commands:
          - export PATH=$PATH:/usr/lib/sdk/bazel/bin
        dest-filename: enable.sh
    buildsystem: simple
    build-commands:
      - cp enable.sh /usr/lib/sdk/bazel/

  - name: metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.bazel.metainfo.xml
    buildsystem: simple
    build-commands:
      - install -Dm0644 org.freedesktop.Sdk.Extension.bazel.metainfo.xml ${FLATPAK_DEST}/share/metainfo/org.freedesktop.Sdk.Extension.bazel.metainfo.xml
