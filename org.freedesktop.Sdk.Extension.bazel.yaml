id: org.freedesktop.Sdk.Extension.bazel
branch: '24.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '24.08'
separate-locales: false
modules:
  - name: bazel
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
      no-debuginfo-compression: true
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/bazelbuild/bazel/releases/download/8.5.1/bazel-8.5.1-linux-x86_64
        sha256: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
        dest-filename: bazel
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/bazelbuild/bazel/releases/download/8.5.1/bazel-8.5.1-linux-arm64
        sha256: b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
        dest-filename: bazel
    build-commands:
      - chmod +x bazel
      - install -d /usr/lib/sdk/bazel/bin
      - cp -rp bazel /usr/lib/sdk/bazel/bin/bazel

  - name: scripts
    sources:
      - type: script
        commands:
          - export PATH=$PATH:/usr/lib/sdk/bazel/bin
        dest-filename: enable.sh
    buildsystem: simple
    build-commands:
      - cp enable.sh /usr/lib/sdk/bazel/

  - name: metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.bazel.metainfo.xml
    buildsystem: simple
    build-commands:
      - install -Dm0644 org.freedesktop.Sdk.Extension.bazel.metainfo.xml ${FLATPAK_DEST}/share/metainfo/org.freedesktop.Sdk.Extension.bazel.metainfo.xml
