id: org.freedesktop.Sdk.Extension.bazel
branch: '24.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '24.08'
separate-locales: false
modules:
  - name: bazel
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
      no-debuginfo-compression: true
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/bazelbuild/bazel/releases/download/9.1.1/bazel-9.1.1-linux-x86_64
        sha256: 857bed5d2756b4d998d3caebf2d941d13d434c4eda4b1d6d7dda205736c25a93
        dest-filename: bazel
        x-checker-data:
          type: anitya
          project-id: 15227
          url-template: https://github.com/bazelbuild/bazel/releases/download/$version/bazel-$version-linux-x86_64
          stable-only: true
          is-important: true
          appstream-changes: true
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/bazelbuild/bazel/releases/download/9.1.1/bazel-9.1.1-linux-arm64
        sha256: 82d1163884e45a6a7ff764cc01197b1b1ed497000726b84dc4b47c1dfc8a2bb4
        dest-filename: bazel
        x-checker-data:
          type: anitya
          project-id: 15227
          url-template: https://github.com/bazelbuild/bazel/releases/download/$version/bazel-$version-linux-arm64
          stable-only: true
          is-important: true
          appstream-changes: true

    build-commands:
      - chmod +x bazel
      - install -d /usr/lib/sdk/bazel/bin
      - cp -rp bazel /usr/lib/sdk/bazel/bin/bazel

  - name: scripts
    sources:
      - type: script
        commands:
          - export PATH=$PATH:/usr/lib/sdk/bazel/bin
        dest-filename: enable.sh
    buildsystem: simple
    build-commands:
      - cp enable.sh /usr/lib/sdk/bazel/

  - name: metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.bazel.metainfo.xml
    buildsystem: simple
    build-commands:
      - install -Dm0644 org.freedesktop.Sdk.Extension.bazel.metainfo.xml ${FLATPAK_DEST}/share/metainfo/org.freedesktop.Sdk.Extension.bazel.metainfo.xml
