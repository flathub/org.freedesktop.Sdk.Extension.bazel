name: Auto Merge Update PR

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  wait-and-merge:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'flathub'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PR criteria and wait for CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking PR #$PR_NUMBER..."
          echo "Branch: $PR_BRANCH"
          echo "Author: $PR_AUTHOR"

          IS_TARGET=false

          # 作者が github-actions[bot] かつ ブランチ名が update-branch/ から始まる
          if [[ "$PR_AUTHOR" == "github-actions[bot]" ]] && [[ "$PR_BRANCH" == update-branch/* ]]; then
            # 本文に flatpak-external-data-checker の署名が含まれているか最終確認
            if [[ "$PR_BODY" == *"flatpak-external-data-checker"* ]]; then
              IS_TARGET=true
            fi
          fi

          if [ "$IS_TARGET" = false ]; then
            echo "This PR is not generated by flatpak-external-data-checker. Skipping auto-merge."
            exit 0
          fi

          echo "Target PR confirmed. Waiting for CI checks to complete..."

          # CIの完了を待機してSquash Merge
          if gh pr checks "$PR_NUMBER" --watch --fail-fast; then
            echo "All CI checks passed! Merging PR with squash..."
            gh pr merge "$PR_NUMBER" --squash --delete-branch
          else
            echo "CI checks failed for PR #$PR_NUMBER. Skipping auto-merge."
            exit 1
          fi
